<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuesEngine - Project Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <h1>ZuesEngine</h1>
                <span class="version">Tracker v2.0</span>
            </div>
            <nav class="nav">
                <button class="nav-item active" data-view="tasks">Tasks</button>
                <button class="nav-item" data-view="wiki">Docs</button>
            </nav>
            <div class="sidebar-actions">
                <button id="reload-defaults-btn" class="btn-ghost">Reload Defaults</button>
                <button id="export-btn" class="btn-ghost">Export</button>
                <button id="import-btn" class="btn-ghost">Import</button>
                <button id="reset-btn" class="btn-ghost danger">Reset</button>
            </div>
        </aside>

        <main class="main">
            <!-- Tasks View -->
            <div id="tasks-view" class="view active">
                <header class="header">
                    <div class="header-left">
                        <h2>Tasks</h2>
                        <div class="stats">
                            <span id="stats-display">0/0 completed</span>
                        </div>
                    </div>
                    <div class="header-right">
                        <input type="text" id="search-input" placeholder="Search..." class="search">
                        <button id="add-root-btn" class="btn-primary">+ Add Task</button>
                        <button id="collapse-all-btn" class="btn-ghost">Collapse All</button>
                        <button id="expand-all-btn" class="btn-ghost">Expand All</button>
                    </div>
                </header>
                <div id="task-tree" class="task-tree"></div>
            </div>

            <!-- Wiki View -->
            <div id="wiki-view" class="view">
                <header class="header">
                    <h2>Documentation</h2>
                    <input type="text" id="wiki-search" placeholder="Search docs..." class="search">
                </header>
                <div class="wiki-layout">
                    <nav id="wiki-nav" class="wiki-nav"></nav>
                    <article id="wiki-content" class="wiki-content">
                        <p class="empty">Select a topic</p>
                    </article>
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-box">
            <header class="modal-header">
                <h3 id="modal-title">New Task</h3>
                <button class="modal-close">&times;</button>
            </header>
            <form id="task-form" class="modal-body">
                <div class="field">
                    <label>Title</label>
                    <input type="text" id="task-title" required placeholder="Task title">
                </div>
                <div class="field">
                    <label>Notes</label>
                    <textarea id="task-notes" rows="4" placeholder="Optional notes..."></textarea>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Category</label>
                        <select id="task-category">
                            <option value="general">General</option>
                            <option value="rendering">Rendering</option>
                            <option value="physics">Physics</option>
                            <option value="audio">Audio</option>
                            <option value="input">Input</option>
                            <option value="networking">Networking</option>
                            <option value="editor">Editor</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-ghost modal-close">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <input type="file" id="file-input" accept=".json" hidden>
    <script src="data.js"></script>
    <script src="data-wiki-extended.js"></script>
    <script src="app.js"></script>
</body>
</html>
